name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "chore/**"
  pull_request:
    branches:
      - main

jobs:
  foundation:
    name: Project foundation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify Python
        run: python --version

      - name: Compile Python files
        run: python -m compileall . -q
