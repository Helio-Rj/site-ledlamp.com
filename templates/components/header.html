<header class="site-header">
    <div class="site-header__container">

        <!-- Identidade da empresa -->
        <a
            class="site-header__brand"
            href="{% url 'home' %}"
            aria-label="LEDLAMP Colchões — página inicial"
        >
            LEDLAMP
            <span>COLCHÕES</span>
        </a>

        <!-- Botão do menu para dispositivos móveis -->
        <button
            class="site-header__menu-toggle"
            type="button"
            aria-expanded="false"
            aria-controls="site-navigation"
            aria-label="Abrir menu de navegação"
        >
            <span></span>
            <span></span>
            <span></span>
        </button>

        <!-- Navegação principal -->
        <nav
            class="site-header__navigation"
            id="site-navigation"
            aria-label="Navegação principal"
        >
            <ul class="site-header__links">

                <li>
                    <a href="{% url 'products' %}">
                        Produtos
                    </a>
                </li>

                <li>
                    <a href="{% url 'technology' %}">
                        Tecnologias
                    </a>
                </li>

                <li>
                    <a href="{% url 'content' %}">
                        Conteúdo
                    </a>
                </li>

                <li>
                    <a href="{% url 'about' %}">
                        Empresa
                    </a>
                </li>

                <li>
                    <a href="{% url 'professionals' %}">
                        Para profissionais
                    </a>
                </li>

                <li>
                    <a href="{% url 'contact' %}">
                        Contato
                    </a>
                </li>

            </ul>
        </nav>

        <!-- Pesquisa do site -->
        <form
            class="site-header__search"
            action="{% url 'search' %}"
            method="get"
            role="search"
        >
            <label
                class="site-header__search-label"
                for="site-search"
            >
                Buscar no site
            </label>

            <input
                id="site-search"
                name="q"
                type="search"
                placeholder="O que você procura?"
            >

            <button type="submit">
                Buscar
            </button>
        </form>

    </div>
</header>
